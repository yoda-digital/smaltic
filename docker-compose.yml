services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prismic
      POSTGRES_PASSWORD: prismic
      POSTGRES_DB: prismic
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prismic"]
      interval: 2s
      retries: 30
volumes:
  dbdata:
